---
layout: default
---

<div style="direction: rtl; text-align: right; family: system-ui;">
  <h2 style="border-bottom: 2px solid #0066cc; padding-bottom: 10px;">أحدث الأخبار والوظائف</h2>
  
  <ul style="list-style: none; padding: 0;">
    {% for post in site.posts %}
      <li style="margin-bottom: 20px; border-bottom: 1px solid #eee; padding-bottom: 10px;">
        <h3><a href="{{ post.url }}" style="color: #0066cc; text-decoration: none;">{{ post.title }}</a></h3>
        <small style="color: #666;">📅 {{ post.date | date: "%Y-%m-%d" }}</small>
        <p>{{ post.excerpt | strip_html | truncate: 150 }}</p>
      </li>
    {% endfor %}
  </ul>
</div>
